name: Validate community index

on:
  pull_request:
    paths:
      - "community-plugins.json"
      - "community-plugins.schema.json"
      - "scripts/validate-community-index.mjs"
      - "scripts/validate-community-index.test.mjs"
      - "scripts/listing-state.mjs"
      - "SUBMISSION.md"
      - "POLICY.md"
      - "community-themes.json"
      - "community-themes.schema.json"
      - "scripts/validate-community-themes.mjs"
      - "scripts/validate-community-themes.test.mjs"
      - "THEMES.md"
      - "README.md"
      - "package.json"
      - ".github/workflows/validate-index.yml"
  push:
    branches: [master]
    paths:
      - "community-plugins.json"
      - "community-plugins.schema.json"
      - "scripts/validate-community-index.mjs"
      - "scripts/validate-community-index.test.mjs"
      - "scripts/listing-state.mjs"
      - "SUBMISSION.md"
      - "POLICY.md"
      - "community-themes.json"
      - "community-themes.schema.json"
      - "scripts/validate-community-themes.mjs"
      - "scripts/validate-community-themes.test.mjs"
      - "THEMES.md"
      - "README.md"
      - "package.json"
      - ".github/workflows/validate-index.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin and standalone theme indexes
        run: npm run validate && npm run test:run && npm run validate:remote
