name: Validate community index

on:
  pull_request:
    paths:
      - "community-plugins.json"
      - "community-plugins.schema.json"
      - "scripts/validate-community-index.mjs"
      - "scripts/validate-community-index.test.mjs"
      - "scripts/listing-state.mjs"
      - "SUBMISSION.md"
      - "POLICY.md"
  push:
    branches: [master]
    paths:
      - "community-plugins.json"
      - "community-plugins.schema.json"
      - "scripts/validate-community-index.mjs"
      - "scripts/validate-community-index.test.mjs"
      - "scripts/listing-state.mjs"
      - "SUBMISSION.md"
      - "POLICY.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate community-plugins.json
        run: npm run validate && npm run test:run && npm run validate:remote
